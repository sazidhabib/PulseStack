services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsestack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulsestack
      POSTGRES_PASSWORD: pulsestack
      POSTGRES_DB: pulsestack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsestack -d pulsestack"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsestack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pulsestack-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://pulsestack:pulsestack@postgres:5432/pulsestack
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-jwt-access-secret-minimum-32-chars-long!
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-minimum-32-chars-long!
      CORS_ORIGIN: http://localhost:3000

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: pulsestack-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pulsestack:pulsestack@postgres:5432/pulsestack
      REDIS_URL: redis://redis:6379
      CONCURRENCY: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pulsestack-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000

volumes:
  postgres_data:
  redis_data:
