services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsestack-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulsestack
      POSTGRES_PASSWORD: pulsestack
      POSTGRES_DB: pulsestack
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulsestack-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
